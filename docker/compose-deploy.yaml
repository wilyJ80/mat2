name: mat-deploy

services:
  mat-app:
   build:
      context: ..
      dockerfile: docker/Dockerfile
   ports:
      - "${APP_PORT-5000}:${APP_PORT-5000}"
   restart: unless-stopped
   command: ["uv", "run", "chainlit", "run", "src/mat2/__init__.py", "--host", "0.0.0.0", "--port", "${APP_PORT}", "-h"]
