name: mat-deploy

services:
  mat-app:
   build:
      context: ..
      dockerfile: docker/Dockerfile
   # A chave da API vem do .env na raiz (ele não é copiado para a imagem).
   env_file:
      - ../.env
   environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "${APP_PORT:-5000}"
   ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
   restart: unless-stopped
   command: ["uv", "run", "mat2"]
